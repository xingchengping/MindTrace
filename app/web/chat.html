<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindTrace 对话</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-mode="chat">
  <div class="chat-window">
    <div class="chat-sessbar" id="sessionBar">
      <button id="sessionBtn" class="chat-sess-btn" title="切换对话">对话 ▾</button>
      <button id="newSession" class="chat-sess-new" title="新建对话">＋ 新建</button>
      <div id="sessionDropdown" class="chat-sess-drop hidden"></div>
    </div>
    <div id="messages" class="messages">
      <div class="welcome">
        <div class="welcome-title">MindTrace</div>
        <div class="welcome-sub">和你的第二大脑对话</div>
      </div>
    </div>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="对话…（Enter 发送）"></textarea>
      <button id="micBtn" class="mic-btn" title="语音对话：点一下开始/结束对话">🎤</button>
      <button id="send">发送</button>
    </div>
  </div>
  <style>
    /* 语音按钮 */
    .mic-btn {
      flex-shrink: 0; cursor: pointer;
      border: 1px solid var(--border); background: var(--card); color: var(--text);
      border-radius: 18px; padding: 12px 14px; font-size: 15px; line-height: 1;
    }
    .mic-btn:hover { background: rgba(10,132,255,0.15); }
    .mic-btn:disabled { opacity: 0.5; cursor: default; }
    /* 语音对话模式（循环中） */
    .mic-btn.mic-live {
      background: rgba(255,59,48,0.22); border-color: rgba(255,59,48,0.55);
      color: #ff3b30; animation: mic-pulse 1.6s ease-in-out infinite;
    }
    .mic-btn.mic-live:hover { background: rgba(255,59,48,0.32); }
    @keyframes mic-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,59,48,0.35); } 50% { box-shadow: 0 0 0 6px rgba(255,59,48,0); } }
    /* 弹窗会话切换条（紧凑版；右侧留 40px 给 ✕ 关闭按钮） */
    .chat-sessbar { display: flex; align-items: center; gap: 8px; padding: 8px 40px 2px 12px; position: relative; z-index: 5; }
    .chat-sess-btn {
      flex: 1; min-width: 0; text-align: left; cursor: pointer;
      border: 1px solid var(--border); background: var(--card); color: var(--text);
      border-radius: 10px; padding: 5px 10px; font-size: 12.5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chat-sess-btn:hover { background: rgba(128,128,128,0.15); }
    .chat-sess-new {
      cursor: pointer; flex-shrink: 0;
      border: 1px solid var(--border); background: var(--card); color: var(--text);
      border-radius: 10px; padding: 5px 10px; font-size: 12.5px;
    }
    .chat-sess-new:hover { background: rgba(10,132,255,0.15); color: var(--accent); }
    .chat-sess-drop {
      position: absolute; top: 100%; left: 12px; right: 12px; z-index: 50;
      background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
      max-height: 230px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    .chat-sess-item {
      display: flex; flex-direction: column; gap: 1px; padding: 7px 12px; cursor: pointer;
      border-bottom: 1px solid var(--border);
    }
    .chat-sess-item:last-child { border-bottom: none; }
    .chat-sess-item:hover { background: rgba(128,128,128,0.12); }
    .chat-sess-item.active { background: rgba(10,132,255,0.14); }
    .chat-sess-item .s-t { font-size: 12.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-sess-item .s-d { font-size: 11px; color: var(--sub); }
    .chat-sess-empty { padding: 14px; text-align: center; color: var(--sub); font-size: 12.5px; }
    .hidden { display: none !important; }
  </style>
  <script src="/static/chat.js"></script>
  <script src="/static/qwebchannel.js"></script>
  <script>
    // 弹窗宿主（Qt）内嵌时：显示 ✕ 关闭按钮，点击关闭弹窗；普通浏览器打开时无桥，不显示
    (function () {
      "use strict";
      var started = false;
      function connect() {
        if (typeof qt === "undefined" || !qt.webChannelTransport || typeof QWebChannel === "undefined") {
          setTimeout(connect, 100);
          return;
        }
        if (started) return;
        started = true;
        new QWebChannel(qt.webChannelTransport, function (channel) {
          var py = channel.objects.py;
          if (!py) return;
          window.__bridge = py;   // 供 chat.js 使用（如流式结束后的语音播报）

          // ✕ 关闭按钮
          var btn = document.createElement("button");
          btn.textContent = "✕";
          btn.title = "关闭";
          btn.style.cssText =
            "position:fixed;top:8px;right:10px;z-index:999;width:26px;height:26px;" +
            "border-radius:50%;border:none;background:rgba(128,128,128,0.22);color:var(--text);" +
            "font-size:13px;line-height:26px;text-align:center;padding:0;cursor:pointer;";
          btn.addEventListener("mouseenter", function () { btn.style.background = "rgba(128,128,128,0.38)"; });
          btn.addEventListener("mouseleave", function () { btn.style.background = "rgba(128,128,128,0.22)"; });
          btn.addEventListener("click", function () { py.closePopover(); });
          document.body.appendChild(btn);

          // 🎤 语音对话：点一次进入持续对话（录音→问答→播报循环），再点一次退出
          var mic = document.getElementById("micBtn");
          if (mic) {
            mic.addEventListener("click", function () {
              if (window.__toggleVoiceLoop) window.__toggleVoiceLoop();
              else if (py.voiceInput) { py.voiceInput(); }  // 兜底：单次录音
            });
            // 语音信号统一在 JS 侧连接（桥不再转发，避免双触发）
            if (py.voiceResultSignal && py.voiceResultSignal.connect) {
              py.voiceResultSignal.connect(function (text) {
                if (window.__onVoiceResult) window.__onVoiceResult(text);
              });
            }
            if (py.speakDoneSignal && py.speakDoneSignal.connect) {
              py.speakDoneSignal.connect(function () {
                if (window.__onSpeakDone) window.__onSpeakDone();
              });
            }
          }
        });
      }
      connect();
    })();
  </script>
</body>
</html>
