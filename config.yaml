# Personal Cognitive OS — 默认配置
# 档位：auto（按内存自动探测）| light | standard | powerful
# 模型分两套（以 8GB 为界）：
#   light（≤8GB）：小模型 + 超量化视觉（懒启动），为工作环境留足内存
#   standard / powerful（>8GB）：同一套大模型，仅上下文/并行不同

app:
  host: 127.0.0.1
  port: 4000
  profile: auto
  data_dir: data
  models_dir: models
  log_level: INFO

# 硬件档位：每个档位决定 模型/上下文/批大小/视觉模型
# threads: auto = 物理核数
profiles:
  light:            # RAM ≤ 8GB（工作软件+系统已占较多，必须留足内存）
    model: MindTrace-1.5b-instruct-q3_k_m.gguf   # 小 LLM（≈0.9GB）
    ctx: 2048
    batch: 128
    threads: auto
    parallel: 1
    vision:                                    # 轻量视觉：超量化 + 按需懒启动
      model: Qwen2.5-VL-3B-Instruct-UD-IQ2_M.gguf
      lazy: true                               # 有截图待理解才启动视觉服务，处理完即停
  standard:         # 8GB < RAM ≤ 16GB（与 powerful 同一套模型）
    model: MindTrace-3b-instruct-q4_k_m.gguf     # 大 LLM（≈1.9GB）
    ctx: 4096
    batch: 256
    threads: auto
    parallel: 1
    vision:
      model: Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf
      lazy: false
  powerful:         # RAM > 16GB（同一套模型，上下文更大 + 双槽并行）
    model: MindTrace-3b-instruct-q4_k_m.gguf
    ctx: 8192
    batch: 512
    threads: auto
    parallel: 2      # 1 槽给用户对话，1 槽给后台提取/任务分析
    vision:
      model: Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf
      lazy: false

# LLM 运行时：llama.cpp 官方二进制（llama-server.exe）
# 后端通过其 OpenAI 兼容 HTTP API 通信（/v1/chat/completions）
llm:
  runtime: llama-server
  server:
    path: llama-b8981-bin-win-cpu-x64/llama-server.exe
    host: 127.0.0.1
    port: 18081            # 若端口被占用，改这里（如 8081 被系统进程占用）
    start_timeout: 180   # 秒
  embedding:               # 第二个 llama-server 进程（--embeddings 模式）
    server:
      path: llama-b8981-bin-win-cpu-x64/llama-server.exe
      host: 127.0.0.1
      port: 18082
      start_timeout: 120
    model: MindTrace-Embedding-0.6B-Q8_0.gguf
    ctx: 512
    batch: 128
    threads: 4
  vision:                # 视觉（截图理解；模型由档位决定，light 档懒启动）
    server:
      path: llama-b8981-bin-win-cpu-x64/llama-server.exe
      host: 127.0.0.1
      port: 18083
      start_timeout: 180
    model: Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf   # 默认；档位可覆盖
    mmproj: mmproj-F16.gguf
    ctx: 4096
    batch: 256
    threads: 6
  # 手动覆盖项（可选；设了就用这里的值）
  # model_path: models/qwen2.5-1.5b-instruct-q4_k_m.gguf
  # n_ctx: 4096
  # n_threads: 8
  # n_batch: 256

# 记忆检索
memory:
  top_k: 5                 # 检索召回条数
  min_score: 0.35          # 相似度阈值（低于视为"没记录到"）
  auto_remember_chat: true # 每轮问答自动沉淀为事件
  dedup_threshold: 0.95    # 向量去重阈值（高于视为重复，合并重要度）

# Windows 采集（Phase 2）
collector:
  enabled: true
  monitor: follow          # follow（跟随前台窗口）| locked | off
  locked_pattern: ""       # monitor=locked 时的窗口标题关键字
  interval_s: 3            # 前台窗口轮询间隔
  start_paused: true       # 启动即暂停采集（右键菜单显示"开始采集"，点击开始才采集）
  watch_dirs: []           # 文件监听目录（如 ["I:/MyProjects"]；空 = 不监听）
  clipboard: false         # 剪贴板采集（授权项，默认关）
  browser_history: false   # 浏览历史（授权项，默认关）
  git: false               # git 日志（授权项，默认关）
  batch_minutes: 5         # 模型级批量提取间隔
  screenshot_policy: text_first   # text_first | auto | off
  agent_apps: [vscode, cursor, claude, codex, windsurf, codium, code]  # Agent 对话窗口识别

# Task Intelligence Engine（Phase 2）
task_engine:
  blocked_persist_batches: 2     # 卡点需连续 N 批失败信号
  solved_min_signals: 2          # 攻克需 ≥N 个独立信号
  focus_bullet_cap: 200          # recent_bullets 上限
  compaction_batch: 50           # 每批压实多少条旧条目
  hot_keywords: [报错, 错误, error, failed, 解决, 搞定, fixed, 通过, success, 完成, works, 卡住, 不行, 失败]
  recall_minutes: 15             # 卡点持续多久后触发"实时联想提醒"
  recall_threshold: 0.85         # 联想相似度阈值（宁可漏报不误报）

# 桌面层（Phase 2）
desktop:
  enabled: true            # 悬浮球/托盘/系统 Toast（--headless 可关）
  bubble: true
  tray: true
  toasts: true
  chat_window: auto        # auto（pywebview 优先，回退 Edge app 模式）| edge | browser

# 记忆巩固（Phase 2）
consolidation:
  short_retention_hours: 24      # 短期日志保留时长
  event_retention_days: 180      # 事件保留天数（超出降级入回收站）
  trash_days: 30                 # 回收站保留天数
  caps:
    memories_short: 50000
    events: 200000
    experiences: 5000
  schedule:
    batch_minutes: 5
    daily: "02:30"

# 模型下载清单（scripts/download_models.py 使用）
models:
  chat:
    source: modelscope        # modelscope | hf-mirror | hf
    entries:
      - file: qwen2.5-1.5b-instruct-q4_k_m.gguf
        repo: Qwen/Qwen2.5-1.5B-Instruct-GGUF
        size_hint_mb: 1100
      - file: MindTrace-1.5b-instruct-q3_k_m.gguf
        repo: Qwen/Qwen2.5-1.5B-Instruct-GGUF
        size_hint_mb: 900
      - file: MindTrace-3b-instruct-q4_k_m.gguf
        repo: Qwen/Qwen2.5-3B-Instruct-GGUF
        size_hint_mb: 1900
  embedding:
    source: modelscope
    entries:
      - file: MindTrace-Embedding-0.6B-Q8_0.gguf
        repo: Qwen/Qwen3-Embedding-0.6B-GGUF
        size_hint_mb: 450
  vision:
    source: modelscope
    entries:
      - file: Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf     # >8GB 档
        repo: unsloth/Qwen2.5-VL-3B-Instruct-GGUF
        size_hint_mb: 2000
      - file: Qwen2.5-VL-3B-Instruct-UD-IQ2_M.gguf   # ≤8GB 档（轻量）
        repo: unsloth/Qwen2.5-VL-3B-Instruct-GGUF
        size_hint_mb: 1400
      - file: mmproj-F16.gguf                        # 视觉投影（两档共用）
        repo: unsloth/Qwen2.5-VL-3B-Instruct-GGUF
        size_hint_mb: 900
